<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>More Practice</title>
		<link
			rel="stylesheet"
			href="styles.css" />
		<script
			src="index.js"
			type="module"
			defer></script>
	</head>
	<body>
		<form
			action=""
			method="dialog"
			id="newForm"
			novalidate>
			<h2>Sign up</h2>
			<label for="emailInput">Email:</label
			><input
				type="email"
				name="emailInput"
				id="emailInput" />
			<label for="countryInput">Country:</label>
			<select
				name="countryInput"
				id="countrySelect"></select>
			<label for="passwordInitial">Password:</label
			><input
				type="password"
				name="passwordInitial"
				id="passwordInitial" />
			<label for="passwordVerify">Confirm Password:</label
			><input
				type="password"
				name="passwordVerify"
				id="passwordVerify" />
			<input
				type="submit"
				value="Add User"
				id="submitUser" />
		</form>
	</body>
</html>
